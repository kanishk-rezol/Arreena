version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aethersfu-postgres
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether_secure_password
      POSTGRES_DB: aethersfu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aethersfu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aethersfu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: aethersfu-coturn
    network_mode: "host"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aethersfu-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://aether:aether_secure_password@postgres:5432/aethersfu_db
      - REDIS_URL=redis://redis:6379/0
      - TURN_SECRET=aethersfu_dev_turn_secret_key_change_in_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
