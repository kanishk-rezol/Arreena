<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Participant join sequence in the SFU</title>
<desc>Sequence of steps when participant C joins a room where A and B are already connected: create uplink, subscribe existing tracks, renegotiate downlinks for A and B, and wire C's relayed track out.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="460" fill="#ffffff"/>

<g>
  <rect x="240" y="30" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">C connects uplink</text>
  <text x="340" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">server receives C's track</text>
</g>
<line x1="340" y1="86" x2="340" y2="114" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="240" y="114" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="134" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Relay subscribes C's track</text>
  <text x="340" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">creates forwardable proxy</text>
</g>
<line x1="340" y1="170" x2="340" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="240" y="198" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="218" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Renegotiate A and B</text>
  <text x="340" y="236" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">add C's track to their downlinks</text>
</g>
<line x1="340" y1="254" x2="340" y2="282" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="240" y="282" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="302" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Build C's downlink</text>
  <text x="340" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">add A and B relayed tracks</text>
</g>
<line x1="340" y1="338" x2="340" y2="366" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="240" y="366" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="386" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Room stable</text>
  <text x="340" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">A, B, C all relayed to each other</text>
</g>

</svg>
