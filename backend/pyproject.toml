[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arreena-sfu"
version = "0.1.0"
description = "FastAPI Control Plane and WebRTC SFU Gateway for Arreena"
readme = "README.md"
authors = [
    { name = "Arreena Core Team", email = "dev@arreena.org" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.3",
    "websockets>=12.0",
    "pyjwt>=2.8.0",
    "aiortc>=1.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "black>=24.3.0",
    "ruff>=0.3.3"
]

[project.scripts]
arreena-server = "aethersfu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aethersfu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
